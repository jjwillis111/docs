<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Documents</title>
<link rel="stylesheet" href="site.css">
<style>
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  nav.doclist { padding: 6px; position: sticky; top: 16px; }
  @media (max-width: 820px) { nav.doclist { position: static; } }
  nav.doclist button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 10px 12px;
    white-space: normal;
    font-size: 15px;
  }
  nav.doclist button:hover { background: var(--box-bg); }
  nav.doclist button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
  nav.doclist .desc { display: block; font-size: 12.5px; opacity: .75; margin-top: 2px; }

  .copybox { overflow: hidden; min-width: 0; }
  .copybox-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px 8px 14px;
    border-bottom: 1px solid var(--line);
  }
  .copybox-bar .title {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .copybox-bar .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  @media (max-width: 480px) { .copybox-bar .meta { display: none; } }
  .copybox iframe.docframe { height: calc(100vh - 170px); min-height: 440px; }
  .copybox .status { background: var(--box-bg); min-height: 300px; }
</style>
</head>
<body>
<header class="site">
  <h1 id="siteTitle">Shared Documents</h1>
  <p>Read here, or press Copy and paste into Word to get the full document with its formatting and footnotes.</p>
</header>

<main>
  <nav class="doclist panel" id="doclist" aria-label="Documents" hidden></nav>

  <section class="copybox panel">
    <div class="copybox-bar">
      <span class="title" id="docTitle">Loading</span>
      <span class="meta" id="docMeta"></span>
      <button class="primary" id="copyBtn" disabled>Copy</button>
    </div>
    <div id="body"><div class="status">Loading…</div></div>
  </section>
</main>

<script src="common.js"></script>
<script>
(function () {
  const SITE_TITLE = "Shared Documents"; // change this to retitle the site
  const D = window.DocShare;
  const $ = id => document.getElementById(id);
  $("siteTitle").textContent = SITE_TITLE;
  document.title = SITE_TITLE;

  let docs = [];
  let current = null; // { html, text }

  function status(msg) {
    current = null;
    $("copyBtn").disabled = true;
    $("body").innerHTML = '<div class="status"></div>';
    $("body").firstChild.textContent = msg;
  }

  function buildList() {
    const nav = $("doclist");
    nav.innerHTML = "";
    nav.hidden = docs.length < 2;
    docs.forEach((d, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = d.title;
      if (d.description) {
        const s = document.createElement("span");
        s.className = "desc";
        s.textContent = d.description;
        b.appendChild(s);
      }
      b.onclick = () => { location.hash = "doc=" + i; };
      nav.appendChild(b);
    });
    // One document: give the viewer the full width
    document.querySelector("main").style.gridTemplateColumns = docs.length < 2 ? "1fr" : "";
  }

  function currentIndex() {
    const m = location.hash.match(/doc=(\d+)/);
    const i = m ? parseInt(m[1], 10) : 0;
    return i >= 0 && i < docs.length ? i : 0;
  }

  async function show(i) {
    const d = docs[i];
    [...$("doclist").children].forEach((b, j) => b.setAttribute("aria-current", j === i ? "true" : "false"));
    $("docTitle").textContent = d.title;
    $("docMeta").textContent = "";
    status("Loading document…");
    try {
      const res = await fetch(d.file, { cache: "no-cache" });
      if (!res.ok) throw new Error("Couldn't load " + d.file + " (" + res.status + ").");
      const html = await res.text();
      const text = D.plainText(html);
      current = { html, text };
      const words = (text.match(/\S+/g) || []).length;
      $("docMeta").textContent = words.toLocaleString() + " words";
      const frame = document.createElement("iframe");
      frame.className = "docframe";
      frame.setAttribute("sandbox", "");   // no scripts can run inside a stored document
      frame.title = d.title;
      frame.srcdoc = D.viewHtml(html);
      $("body").innerHTML = "";
      $("body").appendChild(frame);
      $("copyBtn").disabled = false;
    } catch (e) {
      status(e.message);
    }
  }

  $("copyBtn").onclick = async () => {
    if (!current) return;
    try {
      const ok = await D.copyRich(current.html, current.text);
      D.toast(ok ? "Copied. Paste into Word with Ctrl+V (Mac: Cmd+V)." : "Your browser blocked copying.", 3000);
    } catch (e) {
      D.toast("Your browser blocked copying.");
    }
  };

  fetch("documents.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("documents.json not found."); return r.json(); })
    .then(list => {
      docs = Array.isArray(list) ? list : [];
      if (!docs.length) {
        $("docTitle").textContent = "No documents yet";
        status("Nothing has been published yet.");
        return;
      }
      buildList();
      window.addEventListener("hashchange", () => show(currentIndex()));
      show(currentIndex());
    })
    .catch(e => { $("docTitle").textContent = "Nothing to show"; status(e.message); });
})();
</script>
</body>
</html>
